[project]
name = "arch-compliance"
version = "0.1.0"
description = "CLI agent that scores a solution architecture document against an org's architecture standards"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.50.0",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
]

[project.scripts]
arch-compliance = "arch_compliance.cli:main"
prr-readiness = "prr_readiness.cli:main"
prr-readiness-web = "prr_readiness.web:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["arch_compliance*", "prr_readiness*"]

[tool.setuptools.package-data]
prr_readiness = ["static/*"]
